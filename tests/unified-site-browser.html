<!doctype html><html lang="en"><meta charset="utf-8"><title>RUNNING — Unified site checks</title>
<style>body{font:14px system-ui;background:#101b15;color:#d8ebdc}iframe{width:1100px;height:850px;border:0}pre{white-space:pre-wrap}</style>
<h1>Connected discovery and playground</h1><pre id="results"></pre><iframe id="site" title="Relametric under test"></iframe>
<script type="module">
const frame=document.getElementById('site'),results=document.getElementById('results');let passed=0;const failures=[];
const doc=()=>frame.contentDocument,win=()=>frame.contentWindow;
function assert(value,message){if(!value)throw new Error(message)}
async function until(fn){const start=performance.now();while(!fn()){if(performance.now()-start>20000)throw new Error('Timed out waiting for route');await new Promise(r=>setTimeout(r,50))}}
async function load(path,ready){await new Promise(resolve=>{frame.onload=resolve;frame.src=path});await until(ready)}
async function check(name,fn){try{await fn();passed++;results.textContent+=`PASS · ${name}\n`}catch(e){failures.push(name);results.textContent+=`FAIL · ${name}: ${e.message}\n`}}
function navigation(active){const links=[...doc().querySelectorAll('.rm-navigation a')];assert(links.map(a=>a.textContent).join(',')==='Overview,Examples,Connectors,Playground','Inconsistent navigation');assert(links.filter(a=>a.getAttribute('aria-current')==='page').length===1,'Active navigation ambiguous');assert(doc().querySelector('.rm-navigation [aria-current]').textContent===active,'Wrong active area')}
const ready=()=>doc().querySelector('#viewer')?.dataset.status==='ready';
try{
 await check('A connector opens a real example in Playground with source context',async()=>{
  await load('/connectors/stripe/',()=>doc().querySelector('#workflow'));navigation('Connectors');
  const link=doc().querySelector('#workflow a[href*="playground.html"]');assert(link,'No playground link');
  await load(new URL(link.href).pathname+new URL(link.href).search,ready);navigation('Playground');
  assert(doc().querySelector('#viewer').dataset.example==='source-retention','Wrong example');assert(doc().querySelector('#stage canvas'),'No rendered scene');
  assert(doc().querySelector('.rm-source-context').textContent.includes('Stripe'),'Source context lost');assert(doc().querySelector('.rm-source-context').textContent.includes('synthetic'),'Fixture boundary missing');
  assert(!doc().querySelector('#viewer').matches(':modal'),'Playground must leave global navigation accessible');
 });
 await check('Playground controls and source inspection work for imported examples',async()=>{
  const speed=doc().getElementById('scene-speed');speed.value='0.5';speed.dispatchEvent(new(win().Event)('input',{bubbles:true}));assert(doc().getElementById('scene-speed-value').textContent==='0.50×','Speed control failed');
  doc().querySelector('[data-workspace-view=source]').click();assert(doc().getElementById('source').textContent.length>100,'Recipe missing');
  doc().getElementById('next').click();await until(ready);assert(new URL(win().location.href).searchParams.get('source')==='stripe','Source lost when changing examples');
 });
 await check('All example pages lead to the same Playground runtime',async()=>{
  await load('/examples/?category=Business#correlation-matrix',ready);navigation('Examples');
  const link=doc().querySelector('#example-next a[href*="playground.html"]');assert(link,'No playground entry');
  await load(new URL(link.href).pathname+new URL(link.href).search,ready);assert(doc().getElementById('viewer').dataset.example==='correlation-matrix','Recipe changed during handoff');
 });
 await check('Homepage starts the requested decision and links back into Playground',async()=>{
  await load('/?outcome=retention&source=stripe#decision-lab',()=>doc().body.dataset.relametricReady==='true');navigation('Overview');
  assert(doc().querySelector('[data-decision="retention"]').getAttribute('aria-pressed')==='true','Outcome ignored');
  const href=doc().querySelector('#decision-next a').href;assert(href.includes('example=source-retention')&&href.includes('source=stripe'),'Decision handoff loses context');
 });
 await check('Layer playground keeps code controls and shared navigation',async()=>{
  await load('/demo/playground.html',ready);navigation('Playground');assert(doc().getElementById('viewer').dataset.example==='particles','Default experiment changed');doc().querySelector('[data-workspace-view=source]').click();assert(doc().getElementById('source-section').open&&doc().getElementById('source').textContent.includes('particleField'),'Foundation source missing');
 });
 await check('Seven new examples are discoverable on overview and Playground, including mobile',async()=>{
  const expected=['activation-pathways','payment-routing','renewal-runway','support-escalation','feature-adoption','interview-coverage','performance-friction'];
  frame.style.width='390px';await load('/',()=>doc().querySelectorAll('.rm-recipe-card').length===7);
  const cards=[...doc().querySelectorAll('.rm-recipe-card')];
  assert(cards.every((a,i)=>new URL(a.href).searchParams.get('example')===expected[i]),'Showcase links differ');
  for(const image of doc().querySelectorAll('.rm-recipe-card img')) {image.loading='eager';await until(()=>image.complete);assert(image.naturalWidth>0,'Preview missing');}
  assert(doc().documentElement.scrollWidth<=doc().documentElement.clientWidth+1,'Showcase overflows mobile width');
  await load('/demo/playground.html',ready);
  doc().getElementById('studio-toggle').click();
  assert(doc().body.classList.contains('studio-library-open'),'Mobile library did not open');
  for(const id of expected)assert(doc().querySelector(`[data-experiment="${id}"]`),'New experiment absent from common library');
  frame.style.width='1100px';
  for(const id of expected) {
   await load('/demo/playground.html?example='+id,ready);
   assert(doc().getElementById('viewer').dataset.example===id,'Wrong recipe');
   assert(doc().getElementById('source').textContent.includes('decisionRecipe'),'Recipe source missing');
   assert(doc().querySelectorAll('#data-table tbody tr').length===5,'Snapshot groups missing');
  }
 });
 await check('Foundations and recipes reuse one canvas and preserve settings through browser history',async()=>{
  frame.style.width='1100px';await load('/demo/playground.html?example=particles&source=stripe',ready);
  const canvas=doc().querySelector('#stage canvas'),library=doc().querySelector('.studio-library');
  const slider=doc().getElementById('control-turbulence');slider.value='1.25';slider.dispatchEvent(new(win().Event)('input',{bubbles:true}));
  for(const id of ['network','terrain','hypercube','activation-pathways','feature-adoption']){
   doc().querySelector(`[data-experiment="${id}"]`).click();await until(ready);
   assert(doc().querySelector('#stage canvas')===canvas,'Switch replaced the shared renderer');
   assert(doc().querySelector('.studio-library')===library,'Switch reloaded the application');
   assert(doc().querySelector('[data-experiment][aria-current=true]').dataset.experiment===id,'Active item mismatch');
   assert(new URL(win().location.href).searchParams.get('source')==='stripe','Source context lost');
  }
  doc().querySelector('[data-experiment=particles]').click();await until(ready);
  assert(doc().getElementById('control-turbulence').value==='1.25','Switch lost settings');
  win().history.back();await until(()=>ready()&&doc().getElementById('viewer').dataset.example==='feature-adoption');
  win().history.forward();await until(()=>ready()&&doc().getElementById('viewer').dataset.example==='particles');
  assert(doc().getElementById('control-turbulence').value==='1.25','History lost settings');
  doc().getElementById('studio-reset').click();assert(doc().getElementById('control-turbulence').value==='0.6','Reset did not restore authored settings');
 });
 await check('Search and collections provide an accessible empty state without losing the scene',async()=>{
  const input=doc().getElementById('studio-search');input.value='no-such-experiment';input.dispatchEvent(new(win().Event)('input',{bubbles:true}));
  assert(!doc().getElementById('studio-empty').hidden,'Empty feedback missing');
  assert(doc().getElementById('viewer').dataset.example==='particles','Search replaced scene');
  doc().getElementById('studio-clear').click();
  const filter=doc().getElementById('studio-filter');filter.value='Business';filter.dispatchEvent(new(win().Event)('change',{bubbles:true}));
  assert(doc().querySelector('[data-experiment=particles]').hidden,'Collection includes foundation');
  assert(!doc().querySelector('[data-experiment=activation-pathways]').hidden,'Collection excludes matching recipe');
  doc().querySelector('[data-experiment=activation-pathways]').click();await until(ready);
  doc().querySelector('[data-workspace-view=data]').click();
  assert(doc().getElementById('data-details').open,'Data records not expanded');
  assert(doc().querySelector('.viewer-content').getBoundingClientRect().height===0,'Data view still includes canvas');
  doc().querySelector('[data-workspace-view=source]').click();assert(doc().getElementById('source').textContent.includes('decisionRecipe'),'Wrong source');
  doc().querySelector('[data-workspace-view=view]').click();assert(doc().getElementById('stage').getBoundingClientRect().width>200,'Explore did not restore canvas');
 });
 await check('Gallery cards use canonical workspace links while legacy hash links remain supported',async()=>{
  await load('/examples/?category=Business',()=>doc().querySelector('.card-link'));
  const link=doc().querySelector('[data-card=activation-pathways] .card-link');
  assert(new URL(link.href).pathname==='/demo/playground.html','Gallery opens a second UI');
  await load(new URL(link.href).pathname+new URL(link.href).search,ready);
  assert(doc().querySelector('.studio-library'),'Gallery handoff missed workspace');
 });
 await check('Unknown workspace routes recover to a valid experiment with an explanation',async()=>{
  await load('/demo/playground.html?example=unknown',ready);
  assert(new URL(win().location.href).searchParams.get('example')==='particles','Unknown URL kept stale route');
  assert(doc().getElementById('toast').textContent.includes('not found'),'Recovery message missing');
 });
 await check('Standalone links remain valid and unknown source parameters are ignored',async()=>{
  await load('/examples/run.html?example=source-product&source=unknown',ready);navigation('Examples');assert(!doc().querySelector('.rm-source-context'),'Unrecognized source rendered');
 });
 await check('Mobile Playground keeps all navigation and controls reachable',async()=>{
  frame.style.width='390px';await load('/demo/playground.html?example=source-retention',ready);navigation('Playground');
  assert(doc().documentElement.scrollWidth<=390,'Horizontal overflow');const header=doc().querySelector('.rm-header').getBoundingClientRect(),viewer=doc().getElementById('viewer').getBoundingClientRect();assert(viewer.top>=header.bottom-1,'Navigation overlaps workspace');assert(doc().getElementById('scene-speed'),'Controls missing');doc().getElementById('studio-toggle').click();doc().querySelector('[data-experiment=activation-pathways]').click();await until(ready);assert(!doc().body.classList.contains('studio-library-open'),'Mobile library did not dismiss');assert(doc().activeElement.id==='viewer-title','Focus left in hidden navigation');
 });
 results.textContent+=`\n${failures.length?'FAILED':'ALL'} ${passed} BROWSER CHECKS ${failures.length?'':'PASSED'}`;
 document.title=failures.length?'FAIL — Unified site checks':'PASS — Unified site checks';
}catch(e){results.textContent+=e.stack;document.title='FAIL — Unified site checks'}
</script></html>
