<!doctype html><html lang="en"><meta charset="utf-8"><title>RUNNING — 5js gallery pressure verification</title>
<style>body{background:#101818;color:#d6ffd7;font:14px/1.6 monospace;padding:20px}pre{white-space:pre-wrap}iframe{width:1100px;height:760px;border:1px solid #62746a;max-width:100%}</style>
<h1>5js gallery pressure verification</h1><pre id="results">Starting navigation, narrow-layout, and repeated mounting checks…</pre><iframe id="gallery" title="Gallery under test"></iframe>
<script type="module">
const results=document.querySelector('#results'), frame=document.querySelector('iframe'), checks=[], failures=[];
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function until(fn,message,timeout=15000){const end=performance.now()+timeout;while(performance.now()<end){if(fn())return;await wait(30);}throw Error(message);}
const doc=()=>frame.contentDocument, win=()=>frame.contentWindow;
const el=id=>doc().getElementById(id);
function assert(ok,message){if(!ok)throw Error(message);}
async function check(name,fn){try{await fn();checks.push('PASS · '+name);}catch(error){failures.push(name+': '+error.message);checks.push('FAIL · '+name+': '+error.message);}results.textContent=checks.join('\n');}
async function load(url,previews=true){await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.src=url;});await until(()=>doc()?.querySelector('#cards')&&win().location.href.endsWith(url),'Gallery did not load');if(previews)await until(()=>doc().body.dataset.previews==='ready','Previews did not complete',90000);}
function selected(){return doc().querySelector('[data-filter][aria-pressed="true"]')?.dataset.filter;}
function search(text){el('search').value=text;el('search').dispatchEvent(new (win().Event)('input',{bubbles:true}));}
async function open(id){win().location.hash=id;await until(()=>el('viewer')?.dataset.example===id&&el('viewer')?.dataset.status==='ready'&&el('viewer').open,'Scene did not open: '+id);}
await load('/examples/?category=Space');
await check('Category changes survive refresh and share links',async()=>{
 doc().querySelector('[data-filter="Energy"]').click();
 assert(selected()==='Energy'&&el('result-count').textContent==='2 examples','Energy filter failed');
 assert(new URL(win().location.href).searchParams.get('category')==='Energy','URL retained the old category');
 const url=win().location.pathname+win().location.search;await load(url);assert(selected()==='Energy','Reload lost the category');
});
await check('Search state round-trips through URL without interpreting markup',async()=>{
 search('<img src=x onerror=alert(1)>');assert(!el('cards').querySelector('img[src="x"]'),'Search was interpreted as markup');
 assert(!el('empty').hidden,'No-results message was absent');
 assert(new URL(win().location.href).searchParams.get('q')==='<img src=x onerror=alert(1)>','URL omitted the search');
 search('fusion');const url=win().location.pathname+win().location.search;await load(url);assert(el('search').value==='fusion'&&el('result-count').textContent==='1 example','Reload lost the search');
});
await check('Reset filters clears category and query from the URL',async()=>{
 search('unmatchable-zxy');el('clear-search').click();assert(selected()==='All'&&el('search').value==='','Reset failed');
 const p=new URL(win().location.href).searchParams;assert(!p.has('category')&&!p.has('q'),'Reset left stale URL state');
});
await check('Unknown example URLs cannot leave a different scene open',async()=>{
 await open('fusion-chamber');win().location.hash='missing-pressure-example';await until(()=>!el('toast').hidden,'Missing-route feedback absent');
 await until(()=>!el('viewer').open&&el('stage').querySelectorAll('canvas').length===0,'A stale scene remains under an invalid URL',1000);
});
await check('History back and forward restore the actual scene',async()=>{
 await open('orbital-resonance');await open('jet-stream');win().history.back();await until(()=>el('viewer')?.dataset.example==='orbital-resonance'&&el('viewer')?.dataset.status==='ready','Back did not restore orbital scene');
 win().history.forward();await until(()=>el('viewer')?.dataset.example==='jet-stream'&&el('viewer')?.dataset.status==='ready','Forward did not restore jet scene');
});
await check('20 close/reopen cycles release old canvases',async()=>{
 for(let i=0;i<20;i++){
  await open(i%2?'transit-pulse':'neural-connectome');assert(el('stage').querySelectorAll('canvas').length===1,'Multiple active canvases');
  el('close').click();await until(()=>!el('viewer').open&&el('stage').querySelectorAll('canvas').length===0,'Close left a canvas');
 }
});
await check('375px layout has a usable stage and no horizontal overflow',async()=>{
 frame.style.width='375px';await open('grid-dispatch');await wait(250);
 const r=el('stage').getBoundingClientRect(),d=el('viewer');
 assert(r.width>250&&r.height>=220,'Narrow stage is too small');
 assert(doc().documentElement.scrollWidth<=doc().documentElement.clientWidth+1,'Page overflows horizontally');
 assert(d.scrollWidth<=d.clientWidth+1,'Viewer overflows horizontally');
 assert(el('scene-speed').getBoundingClientRect().width>200,'Controls are squeezed');
});
await check('Source and data remain accessible on a narrow viewport',async()=>{
 el('source-section').open=true;assert(el('source').textContent.includes("id: 'grid-dispatch'")||el('source').textContent.includes("id:'grid-dispatch'"),'Wrong recipe source');
 el('data-details').open=true;assert(el('data-table').tBodies[0].rows.length===6,'Missing source data');
 el('source-section').open=false;el('data-details').open=false;
});
await check('Reduced-motion preference starts the gallery paused',async()=>{
 await load('/tests/gallery-environment.html?mode=reduced-motion#orbital-resonance');
 await until(()=>el('viewer').dataset.status==='ready','Reduced-motion scene failed');
 assert(el('play').getAttribute('aria-label')==='Play animation','Reduced motion starts animated');
 assert(!el('orbit').checked,'Reduced motion starts auto-orbit');
});
await check('Throwing custom cleanup still closes the viewer and releases its canvas',async()=>{
 await load('/tests/gallery-environment.html?mode=throwing-cleanup#fusion-chamber',false);
 await until(()=>el('viewer').dataset.status==='ready','Cleanup fixture did not open');
 el('close').click();await until(()=>!el('viewer').open&&el('stage').querySelectorAll('canvas').length===0,'A custom cleanup error leaked the renderer',1500);
 assert(win().location.hash==='','Failed cleanup left a stale URL');
 await open('orbital-resonance');assert(el('stage').querySelectorAll('canvas').length===1,'Reopening after cleanup error failed');
});
await check('WebGL2 failure leaves an explanation and readable source',async()=>{
 await load('/tests/gallery-environment.html?mode=no-webgl#fusion-chamber',false);
 await until(()=>el('viewer').dataset.status==='error','No graphics error state');
 assert(!el('stage-error').hidden&&el('stage-error').textContent.includes('could not start'),'Missing graphics error explanation');
 assert(el('stage').querySelectorAll('canvas').length===0,'Failed renderer left a canvas');
 el('source-section').open=true;assert(el('source').textContent.includes('fusion-chamber'),'Source unavailable without WebGL');
});
results.textContent=checks.join('\n')+'\n\n'+(failures.length?`${failures.length} PRESSURE CHECKS FAILED`:`ALL ${checks.length} PRESSURE CHECKS PASSED`);
document.title=(failures.length?'FAIL':'PASS')+' — 5js gallery pressure verification';
</script></html>
